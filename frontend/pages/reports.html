<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - Smart Toll</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="shell">
        <div id="sidebar-placeholder"></div>
        <div class="main">
            <header class="topbar">
                <div class="page-title" id="topbar-title">Reports</div>
                <div class="user">
                    <span class="avatar" id="user-avatar"></span>
                    <span id="user-name"></span>
                    <button class="btn ghost small" id="logout-btn">Logout</button>
                </div>
            </header>
            <main class="content">
                <div class="kpi-grid">
                    <div class="kpi"><div class="label">Today</div><div class="value green" id="rev-today">-</div></div>
                    <div class="kpi"><div class="label">This Week</div><div class="value green" id="rev-week">-</div></div>
                    <div class="kpi"><div class="label">This Month</div><div class="value green" id="rev-month">-</div></div>
                    <div class="kpi"><div class="label">All Time</div><div class="value green" id="rev-total">-</div></div>
                </div>

                <div class="grid-2" id="charts-row">
                    <div class="card"><h3>Daily Revenue (7 Days)</h3><canvas id="chart-daily" height="220"></canvas></div>
                    <div class="card"><h3>Vehicle Distribution</h3><canvas id="chart-vehicles" height="220"></canvas></div>
                    <div class="card"><h3>Payment Methods</h3><canvas id="chart-payments" height="220"></canvas></div>
                    <div class="card">
                        <h3>Summary</h3>
                        <div id="summary-body" style="color:var(--muted)">Loading...</div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <div class="toast" id="toast"></div>

    <script src="../assets/vendor/chart.umd.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/reports.js"></script>
</body>
</html>
