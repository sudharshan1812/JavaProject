<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Smart Toll</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="login-page">
    <div class="login-card">
        <div class="logo">
            <div class="logo" style="width:44px;height:44px;font-size:17px">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#052e1f" stroke-width="2" stroke-linecap="round">
                    <path d="M7 12a5 5 0 0 1 10 0"/>
                    <path d="M4.5 9a8.5 8.5 0 0 1 15 0"/>
                    <path d="M2 6a12 12 0 0 1 20 0"/>
                    <circle cx="12" cy="14.5" r="1.5" fill="#052e1f" stroke="none"/>
                </svg>
            </div>
            <div>
                <h2>Smart Toll System</h2>
                <p style="margin:0">RFID Toll Control Dashboard</p>
            </div>
        </div>
        <p>Sign in with your operator account.</p>
        <form id="login-form">
            <div class="field">
                <label for="username">Username</label>
                <input id="username" required autocomplete="username" placeholder="admin">
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input id="password" type="password" required autocomplete="current-password" placeholder="••••••••">
            </div>
            <p id="error-msg" style="color:#fca5a5;font-size:13px;min-height:18px"></p>
            <button type="submit" id="login-btn" class="btn primary" style="width:100%;justify-content:center">Sign In</button>
        </form>
        <div class="hint">demo login: admin / admin123</div>
    </div>
    <div class="toast" id="toast"></div>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
