<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicles - Smart Toll</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="shell">
        <div id="sidebar-placeholder"></div>
        <div class="main">
            <header class="topbar">
                <div class="page-title" id="topbar-title">Vehicles</div>
                <div class="user">
                    <span class="avatar" id="user-avatar"></span>
                    <span id="user-name"></span>
                    <button class="btn ghost small" id="logout-btn">Logout</button>
                </div>
            </header>
            <main class="content">
                <div class="search-row">
                    <input id="search-q" placeholder="Search by vehicle number or owner...">
                    <button class="btn" id="search-btn">Search</button>
                    <a class="btn primary" href="register-vehicle.html" style="margin-left:auto">+ Register Vehicle</a>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr><th>Vehicle No</th><th>Owner</th><th>Type</th><th>RFID</th><th>Tag Status</th><th>Status</th><th style="text-align:right">Actions</th></tr>
                        </thead>
                        <tbody id="vehicles-tbody">
                            <tr><td colspan="7" class="empty">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <div class="modal-backdrop" id="detail-modal">
        <div class="modal">
            <h2>Vehicle Details</h2>
            <div id="detail-body"></div>
        </div>
    </div>
    <div class="toast" id="toast"></div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/vehicles.js"></script>
</body>
</html>
